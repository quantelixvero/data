<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dhaka College — HSC 21 Students Portal</title>
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<link rel="shortcut icon" href="images/logo.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8FAFC; --bg-card: #FFFFFF; --text: #0F172A; --text-muted: #64748B;
  --accent: #1D4ED8; --accent-light: #EEF2FF; --accent-hover: #1E40AF; --border: #E2E8F0;
  --surface-alt: #F1F5F9; --shadow: 0 1px 3px rgba(0,0,0,.06);
  --sh-md: 0 6px 18px rgba(0,0,0,.08); --radius: 12px;
}
[data-theme="dark"] {
  --bg: #0B1120; --bg-card: #1E293B; --text: #F8FAFC; --text-muted: #94A3B8;
  --accent: #3B82F6; --accent-light: #1E3A8A44; --accent-hover: #60A5FA; --border: #334155;
  --surface-alt: #0F172A; --shadow: 0 1px 3px rgba(0,0,0,.3);
  --sh-md: 0 6px 18px rgba(0,0,0,.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }

/* PIN OVERLAY & OFFICIAL LOGO */
.pin-overlay { position:fixed; inset:0; background:rgba(15,23,42,.92); z-index:99999;
  display:flex; align-items:center; justify-content:center; backdrop-filter:blur(8px); }
.pin-box { background:var(--bg-card); border-radius:18px; padding:36px 30px; text-align:center;
  box-shadow: 0 25px 70px rgba(0,0,0,.35); max-width:400px; width:90%; border:1px solid var(--border); }
.auth-logo {
  width: 56px; height: 56px; border-radius: 12px; object-fit: contain;
  background: white; border: 1.5px solid var(--border); box-shadow: var(--sh-md);
  margin: 0 auto 12px; display: block;
}
.pin-box h2 { font-size:20px; font-weight:800; margin-bottom:2px; }
.pin-box .batch-tag { display:inline-block; background:var(--accent); color:white;
  padding:4px 14px; border-radius:20px; font-size:12.5px; font-weight:700; margin:8px 0 14px; }
.pin-box input { width:100%; padding:14px; font-size:22px; text-align:center; letter-spacing:10px;
  border:2px solid var(--border); border-radius:12px; background:var(--surface-alt); color:var(--text);
  font-weight:700; outline:none; transition:all .2s; }
.pin-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light); }
.pin-box .pin-err { color:#DC2626; font-size:13px; font-weight:600; margin-top:10px; display:none; }
.pin-box button { margin-top:18px; width:100%; padding:13px; background:var(--accent); color:white;
  border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; transition:all .2s; }
.pin-box button:hover { background:var(--accent-hover); }

/* TOP BAR WITH EXACT SAME BRANDING & LOGO AS INDEX */
.top-bar { background:var(--bg-card); border-bottom:1px solid var(--border); padding:10px 24px;
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.top-brand-group { display:flex; align-items:center; gap:12px; }
.top-brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); }
.nav-logo {
  width:34px; height:34px; border-radius:8px; object-fit:contain;
  background:white; border:1.5px solid var(--border); box-shadow:var(--shadow); flex-shrink:0;
}
.nav-brand-text h1 { font-size:15px; font-weight:800; color:var(--text); letter-spacing:-.2px; margin:0; line-height:1.2; }
.nav-brand-text p { font-size:10px; color:var(--text-muted); font-weight:600; margin:0; }

/* BATCH DROPDOWN MENU */
.batch-dropdown-wrap { position:relative; display:inline-block; }
.batch-pill-btn {
  background:var(--accent); color:#FFF; border:none; padding:4px 13px; border-radius:20px;
  font-size:12.5px; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  box-shadow:0 2px 8px rgba(29,78,216,0.3); transition:all .15s ease; font-family:'Inter',sans-serif;
}
.batch-pill-btn:hover { background:var(--accent-hover); transform:translateY(-1px); }
.batch-dropdown-wrap:hover .batch-menu { display:block; }
.batch-menu {
  position:absolute; top:calc(100% + 6px); left:0; min-width:180px;
  background:var(--bg-card); border:1.5px solid var(--border); border-radius:12px;
  box-shadow:0 14px 35px rgba(0,0,0,0.18); padding:6px; z-index:9999; display:none;
  animation:fadeIn .15s ease;
}
.batch-menu.show { display:block; }
.batch-menu-title { font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; padding:6px 10px 4px; letter-spacing:.5px; }
.batch-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px; text-decoration:none; color:var(--text); font-size:13px;
  font-weight:700; border-radius:8px; transition:all .12s;
}
.batch-item:hover { background:var(--accent-light); color:var(--accent); }
.batch-item.active { background:var(--accent); color:#FFF; font-weight:800; }
.batch-item .b-tag { font-size:10px; padding:2px 6px; border-radius:4px; background:rgba(0,0,0,.15); }
@keyframes fadeIn { from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:translateY(0);} }

.top-bar .links { display:flex; gap:10px; align-items:center; }
.theme-btn { background:var(--surface-alt); border:1px solid var(--border); font-size:16px;
  cursor:pointer; color:var(--text); width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; }

/* MAIN CONTAINER */
.main { max-width:1440px; margin:0 auto; padding:20px; }

/* CONTROLS & FILTER BAR */
.search-bar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;
  background:var(--bg-card); padding:12px 16px; border-radius:var(--radius); border:1px solid var(--border); }
.search-bar input { flex:1; min-width:200px; padding:9px 14px; border:1.5px solid var(--border);
  border-radius:8px; font-size:14px; background:var(--surface-alt); color:var(--text); outline:none; transition:all .2s; }
.search-bar input:focus { border-color:var(--accent); background:var(--bg-card); }
.search-bar select { padding:9px 12px; border:1.5px solid var(--border); border-radius:8px;
  background:var(--surface-alt); color:var(--text); font-size:13px; font-weight:600; cursor:pointer; outline:none; }
.search-bar select:focus { border-color:var(--accent); }
.btn { padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface-alt);
  color:var(--text); font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.btn:hover { background:var(--accent-light); color:var(--accent); }

/* 4 VIEW TOGGLE BUTTONS */
.view-toggle { display:inline-flex; background:var(--surface-alt); border-radius:8px; padding:3px; border:1px solid var(--border); }
.vt-btn { padding:6px 12px; border:none; background:transparent; color:var(--text-muted);
  font-size:12.5px; font-weight:700; border-radius:6px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .15s; }
.vt-btn.active { background:var(--bg-card); color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.1); }

.count { font-size:13px; color:var(--text-muted); font-weight:600; margin-left:auto; }

/* ── VIEW 1: PHOTOS GRID (LARGE PHOTOS FOCUS) ── */
.view-photos { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:16px; }
.photo-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
  overflow:hidden; text-align:center; padding:12px 10px 10px; cursor:pointer; transition:all .18s; position:relative; box-shadow:var(--shadow); }
.photo-card:hover { transform:translateY(-3px); box-shadow:var(--sh-md); border-color:var(--accent); }
.photo-card .img-wrap { width:155px; height:175px; margin:0 auto 10px; border-radius:12px; overflow:hidden;
  background:var(--surface-alt); border:2px solid var(--border); position:relative; }
.photo-card img { width:100%; height:100%; object-fit:cover; }
.photo-card .p-roll-tag { position:absolute; top:5px; left:5px; background:rgba(15,23,42,0.88);
  color:#FFF; font-size:11px; font-weight:800; padding:2px 7px; border-radius:5px; font-family:monospace; }
.photo-card .p-sec-tag { position:absolute; top:5px; right:5px; background:var(--accent);
  color:#FFF; font-size:11px; font-weight:800; padding:2px 7px; border-radius:5px; box-shadow:0 2px 4px rgba(0,0,0,.25); }
.photo-card .p-sec-tag.com-tag { background:#059669; }
.photo-card .p-sec-tag.hum-tag { background:#7C3AED; }
.photo-card h4 { font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3; }
.photo-card .p-meta { font-size:11.5px; color:var(--text-muted); margin-top:2px; font-family:monospace; }

/* ── VIEW 2: COMPACT CARDS ── */
.view-compact { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; }
.compact-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px;
  padding:10px; display:flex; gap:10px; align-items:center; cursor:pointer; transition:all .15s; box-shadow:var(--shadow); }
.compact-card:hover { transform:translateY(-2px); box-shadow:var(--sh-md); border-color:var(--accent); }
.compact-photo { width:58px; height:58px; border-radius:10px; object-fit:cover; border:1.5px solid var(--border); flex-shrink:0; background:var(--surface-alt); }
.compact-info { flex:1; min-width:0; }
.compact-info h4 { font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.compact-info .c-sub { font-size:11.5px; color:var(--text-muted); display:flex; gap:5px; align-items:center; margin-top:2px; }

/* ── VIEW 3: DETAILED CARDS (EXPANDED RICH CARDS) ── */
.view-detailed { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:16px; }
.card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden; transition:all .18s; cursor:pointer; }
.card:hover { box-shadow:var(--sh-md); transform:translateY(-2px); border-color:var(--accent); }
.card-top { display:flex; gap:14px; padding:16px; align-items:center; }
.card-photo { width:88px; height:88px; border-radius:14px; object-fit:cover; border:2px solid var(--border);
  background:var(--surface-alt); flex-shrink:0; }
.card-info { flex:1; min-width:0; }
.card-info h3 { font-size:15px; font-weight:700; line-height:1.3; margin-bottom:4px; }
.card-info .meta { font-size:12px; color:var(--text-muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.card-info .roll { font-family:monospace; font-size:12px; color:var(--accent); font-weight:700; margin-top:3px; }
.sec-chip { background:var(--accent-light); color:var(--accent); font-size:11px; font-weight:800;
  padding:2px 7px; border-radius:4px; display:inline-block; }
.sec-chip.com-chip { background:#D1FAE5; color:#065F46; }
.sec-chip.hum-chip { background:#EDE9FE; color:#5B21B6; }
.card-badges { padding:0 16px 10px; display:flex; flex-wrap:wrap; gap:5px; }

/* QUICK COMMUNICATION & ACTION BUTTONS (Call, WhatsApp, Telegram, Web Photo, PDF) */
.comm-actions { display:flex; gap:6px; padding:0 16px 12px; flex-wrap:wrap; align-items:center; }
.comm-btn {
  text-decoration:none; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:6px;
  display:inline-flex; align-items:center; gap:4px; transition:all .15s;
}
.comm-btn.call { background:#EFF6FF; color:#1D4ED8; border:1px solid #BFDBFE; }
.comm-btn.call:hover { background:#1D4ED8; color:#FFF; }
.comm-btn.whatsapp { background:#ECFDF5; color:#059669; border:1px solid #A7F3D0; }
.comm-btn.whatsapp:hover { background:#059669; color:#FFF; }
.comm-btn.telegram { background:#F0F9FF; color:#0284C7; border:1px solid #BAE6FD; }
.comm-btn.telegram:hover { background:#0284C7; color:#FFF; }
.comm-btn.web-photo { background:var(--surface-alt); color:var(--text-muted); border:1px solid var(--border); }
.comm-btn.web-photo:hover { background:var(--accent-light); color:var(--accent); }
.pdf-chip-btn {
  text-decoration:none; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:6px;
  background:#FEF2F2; color:#DC2626; border:1px solid #FECACA; display:inline-flex; align-items:center; gap:4px;
}
.pdf-chip-btn:hover { background:#DC2626; color:#FFF; }

/* ── VIEW 4: DETAILS LIST (TABLE STYLE) ── */
.view-list { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); overflow-x:auto; box-shadow:var(--shadow); }
.list-tbl { width:100%; border-collapse:collapse; text-align:left; font-size:13px; }
.list-tbl th { background:var(--surface-alt); padding:10px 14px; font-weight:700; font-size:12px;
  color:var(--text-muted); border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:0.5px; }
.list-tbl td { padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
.list-tbl tr:hover td { background:var(--accent-light); cursor:pointer; }
.list-photo { width:42px; height:42px; border-radius:50%; object-fit:cover; border:1px solid var(--border); }

/* SUBJECT BADGES */
.sbadge { font-size:11px; font-weight:600; padding:2px 8px; border-radius:5px; display:inline-block; }
.sbadge.mandatory { background:var(--surface-alt); color:var(--text); border:1px solid var(--border); }
.sbadge.elective { background:#EEF2FF; color:#1D4ED8; border:1px solid #BFDBFE; }
.sbadge.fourth { background:#FEF3C7; color:#B45309; border:1px solid #FDE68A; }

/* PROFILE MODAL */
.modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.65); z-index:9000; display:none;
  align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.modal-bg.show { display:flex; }
.modal { background:var(--bg-card); border-radius:18px; max-width:540px; width:92%;
  max-height:88vh; overflow-y:auto; box-shadow:0 25px 70px rgba(0,0,0,.3); border:1px solid var(--border); }
.modal-hdr { display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:24px 20px 16px; border-bottom:1px solid var(--border); position:relative; }
.modal-hdr img { width:150px; height:150px; border-radius:20px; object-fit:cover;
  border:3.5px solid var(--accent); box-shadow:var(--sh-md); margin-bottom:12px; }
.modal-hdr .info h2 { font-size:19px; font-weight:800; }
.modal-hdr .info .sub { font-size:13px; color:var(--text-muted); margin-top:2px; }
.modal-close { position:absolute; right:16px; top:16px; background:var(--surface-alt); border:none;
  width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; color:var(--text); display:flex; align-items:center; justify-content:center; }
.modal-body { padding:18px 22px 22px; }
.pf-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); }
.pf-lbl { font-size:13px; color:var(--text-muted); font-weight:600; }
.pf-val { font-size:13.5px; font-weight:700; text-align:right; }
.pf-subj { margin-top:16px; }
.pf-subj-hdr { font-size:12px; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
.pf-badges { display:flex; flex-wrap:wrap; gap:6px; }

@media(max-width:768px) {
  .search-bar { flex-direction:column; align-items:stretch; }
  .count { margin-left:0; text-align:center; }
}
</style>
</head>
<body>

<!-- PIN OVERLAY WITH OFFICIAL DHAKA COLLEGE LOGO -->
<div class="pin-overlay" id="pinOverlay">
  <div class="pin-box">
    <img class="auth-logo" src="images/logo.svg" alt="Dhaka College Logo" onerror="this.src='../images/logo.svg'; if(!this.complete) this.src='logo.svg';">
    <h2>Dhaka College</h2>
    <div class="batch-tag">HSC 21 Students Portal</div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">1129 Students &bull; Session 2019-2020</p>
    <input type="password" id="pinInput" maxlength="8" placeholder="••••••" autofocus
      onkeyup="if(event.key==='Enter')checkPin()">
    <div class="pin-err" id="pinErr"><i class="fa-solid fa-circle-exclamation"></i> Incorrect PIN. Try again.</div>
    <button onclick="checkPin()"><i class="fa-solid fa-lock-open"></i> Unlock Portal</button>
  </div>
</div>

<!-- TOP BAR WITH EXACT SAME LOGO & BRANDING AS MAIN PORTAL -->
<div class="top-bar" id="mainContent" style="display:none;">
  <div class="top-brand-group">
    <a href="index.html" class="top-brand" title="Dhaka College Student Database">
      <img class="nav-logo" src="images/logo.svg" alt="Dhaka College Logo" onerror="this.src='../images/logo.svg'; if(!this.complete) this.src='logo.svg';">
      <div class="nav-brand-text">
        <h1>Dhaka College</h1>
        <p>Student Database System</p>
      </div>
    </a>
    <!-- BATCH DROPDOWN -->
    <div class="batch-dropdown-wrap">
      <button class="batch-pill-btn" onclick="toggleBatchMenu(event)" title="Click or hover to switch batch">
        HSC 21 <i class="fa-solid fa-chevron-down" style="font-size:10px;margin-left:4px;"></i>
      </button>
      <div class="batch-menu" id="batchMenu">
        <div class="batch-menu-title"><i class="fa-solid fa-layer-group"></i> Switch Batch</div>
        <a href="index.html" class="batch-item "><i class="fa-solid fa-crown" style="color:#F59E0B;"></i> HSC 27 <span class="b-tag">Current</span></a>
        <a href="hsc26.html" class="batch-item ">HSC 26</a>
        <a href="hsc25.html" class="batch-item ">HSC 25</a>
        <a href="hsc24.html" class="batch-item ">HSC 24</a>
        <a href="hsc23.html" class="batch-item ">HSC 23</a>
        <a href="hsc22.html" class="batch-item ">HSC 22</a>
        <a href="hsc21.html" class="batch-item active">HSC 21</a>
        <a href="hsc20.html" class="batch-item ">HSC 20</a>
        <a href="hsc19.html" class="batch-item ">HSC 19</a>
      </div>
    </div>
  </div>
  <div class="links">
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle Dark Mode"><i class="fa-solid fa-circle-half-stroke"></i></button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main" id="mainArea" style="display:none;">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search by name, roll, section, phone..." oninput="applyFilters()">
    <select id="filterGroup" onchange="applyFilters()">
      <option value="">All Groups (1129)</option>
      <option value="Science">Science (860)</option>
      <option value="Business Studies">Business Studies (132)</option>
      <option value="Humanities">Humanities (137)</option>
    </select>
    <select id="filterSection" onchange="applyFilters()">
      <option value="">All Sections</option>
      <option value="A">Section A (Roll 1–150)</option>
      <option value="B">Section B (Roll 151–300)</option>
      <option value="C">Section C (Roll 301–450)</option>
      <option value="D">Section D (Roll 451–600)</option>
      <option value="E">Section E (Roll 601–750)</option>
      <option value="F">Section F (Roll 751–900+)</option>
    </select>
    
    <!-- 4 VIEW MODES -->
    <div class="view-toggle">
      <button class="vt-btn" id="vtPhotos" onclick="setView('photos')" title="Large Photos Grid"><i class="fa-solid fa-images"></i> Photos</button>
      <button class="vt-btn" id="vtCompact" onclick="setView('compact')" title="Compact Cards"><i class="fa-solid fa-border-all"></i> Compact</button>
      <button class="vt-btn active" id="vtDetailed" onclick="setView('detailed')" title="Detailed Cards"><i class="fa-solid fa-id-card"></i> Detailed</button>
      <button class="vt-btn" id="vtList" onclick="setView('list')" title="Details Table"><i class="fa-solid fa-table-list"></i> List</button>
    </div>
    
    <button class="btn" onclick="resetFilters()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
    <span class="count" id="resultCount">Showing <b>1129</b> of 1129</span>
  </div>

  <div id="viewContainer"></div>

  <div id="loadMore" style="text-align:center;padding:24px 0;display:none;gap:10px;justify-content:center;">
    <button class="btn" onclick="loadMoreCards()" style="padding:10px 24px;font-weight:700;">
      <i class="fa-solid fa-arrow-down"></i> Load More (+120)
    </button>
    <button class="btn" onclick="loadAllCards()" style="padding:10px 20px;background:var(--accent-light);color:var(--accent);font-weight:700;">
      <i class="fa-solid fa-users"></i> Show All (1129)
    </button>
  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal-bg" id="profileModal" onclick="if(event.target===this)closeProfile()">
  <div class="modal" style="position:relative;">
    <button class="modal-close" onclick="closeProfile()">&times;</button>
    <div class="modal-hdr" id="profileHdr"></div>
    <div class="modal-body" id="profileBody"></div>
  </div>

const DEFAULT_AVATAR = "images/logo.svg";

let SD=[], cd=[], page=0, PER=120, currentView='detailed';

function toggleBatchMenu(e) {
  e.stopPropagation();
  const m = document.getElementById('batchMenu');
  m.classList.toggle('show');
}
document.addEventListener('click', () => {
  const m = document.getElementById('batchMenu');
  if (m) m.classList.remove('show');
});

// PHOTO PRIORITY:
// 1. Primary: Local folder photo first! (from main folders hsc19-hsc26/photos/...)
// 2. Alternative: Dhaka College online website link as fallback!
function getImgTag(s, cls="card-photo", style="", extra="") {
  const pri = s.local_photo || s.photo_url || DEFAULT_AVATAR;
  const fb = s.photo_url || DEFAULT_AVATAR;
  return `<img class="${cls}" src="${pri}" data-fb="${fb}" style="${style}" ${extra} alt="${s.name}" loading="lazy"
    onerror="if(this.dataset.fb && this.src !== this.dataset.fb){ this.src=this.dataset.fb; } else { this.onerror=null; this.src='${DEFAULT_AVATAR}'; }">`;
}

function getStreamBadge(s) {
  if (s.group === 'Science') {
    return s.section ? `<span class="p-sec-tag">${s.section}</span>` : '';
  } else if (s.group === 'Business Studies' || s.group === 'Commerce') {
    return `<span class="p-sec-tag com-tag">Com</span>`;
  } else if (s.group === 'Humanities' || s.group === 'Arts') {
    return `<span class="p-sec-tag hum-tag">Hum</span>`;
  }
  return '';
}

function getStreamChip(s) {
  if (s.group === 'Science') {
    return s.section ? `<span class="sec-chip">Sec ${s.section}</span>` : '';
  } else if (s.group === 'Business Studies' || s.group === 'Commerce') {
    return `<span class="sec-chip com-chip">Commerce</span>`;
  } else if (s.group === 'Humanities' || s.group === 'Arts') {
    return `<span class="sec-chip hum-chip">Humanities</span>`;
  }
  return '';
}

function getCommHtml(s) {
  let html = '';
  if (s.phone && s.phone !== '—') {
    const pNum = s.phone.replace(/[^0-9]/g, '');
    if (pNum.length >= 10) {
      const intl = pNum.startsWith('88') ? pNum : ('88' + pNum.replace(/^0/, ''));
      html += `
        <a href="tel:${pNum}" class="comm-btn call" onclick="event.stopPropagation()" title="Call ${s.phone}"><i class="fa-solid fa-phone"></i> Call</a>
        <a href="https://wa.me/${intl}" target="_blank" class="comm-btn whatsapp" onclick="event.stopPropagation()" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i> WA</a>
        <a href="https://t.me/+${intl}" target="_blank" class="comm-btn telegram" onclick="event.stopPropagation()" title="Telegram"><i class="fa-brands fa-telegram"></i> TG</a>
      `;
    }
  }
  if (s.pdf_link && s.pdf_link !== '—') {
    html += `<a href="${s.pdf_link}" target="_blank" class="pdf-chip-btn" onclick="event.stopPropagation()" title="Official Payment Slip / Receipt"><i class="fa-solid fa-file-pdf"></i> PDF</a>`;
  }
  if (s.photo_url && s.photo_url !== '—') {
    html += `<a href="${s.photo_url}" target="_blank" class="comm-btn web-photo" onclick="event.stopPropagation()" title="Original Dhaka College Website Photo Link"><i class="fa-solid fa-arrow-up-right-from-square"></i> Web Photo</a>`;
  }
  return html ? `<div class="comm-actions">${html}</div>` : '';
}

async function decryptAndShow(p) {
  const raw = atob(ED);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  const nonce = bytes.slice(0, 12), ct = bytes.slice(12);
  const enc = new TextEncoder();
  const keyBuf = await crypto.subtle.digest('SHA-256', enc.encode(p));
  const key = await crypto.subtle.importKey('raw', keyBuf, {name: 'AES-GCM'}, false, ['decrypt']);
  const dec = await crypto.subtle.decrypt({name: 'AES-GCM', iv: nonce}, key, ct);
  const txt = new TextDecoder().decode(dec);
  SD = JSON.parse(txt); cd = [...SD];
  document.getElementById('pinOverlay').style.display = 'none';
  document.getElementById('mainContent').style.display = '';
  document.getElementById('mainArea').style.display = '';
  page = 0;
  const savedView = localStorage.getItem('dc_view_mode');
  if (savedView && ['photos','compact','detailed','list'].includes(savedView)) {
    currentView = savedView;
  }
  updateViewButtons();
  render();
}

async function checkPin() {
  const p = document.getElementById('pinInput').value.trim();
  try {
    await decryptAndShow(p);
    localStorage.setItem('dc_pin', p);
  } catch(e) {
    document.getElementById('pinErr').style.display = 'block';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').focus();
  }
}

// Seamless auto-unlock via localStorage
(async() => {
  const saved = localStorage.getItem('dc_pin');
  if (saved) {
    try { await decryptAndShow(saved); } catch(e) {}
  }
})();

function setView(v) {
  currentView = v;
  localStorage.setItem('dc_view_mode', v);
  updateViewButtons();
  page = 0;
  render();
}

function updateViewButtons() {
  document.querySelectorAll('.vt-btn').forEach(b => b.classList.remove('active'));
  if (currentView === 'photos') document.getElementById('vtPhotos').classList.add('active');
  else if (currentView === 'compact') document.getElementById('vtCompact').classList.add('active');
  else if (currentView === 'list') document.getElementById('vtList').classList.add('active');
  else document.getElementById('vtDetailed').classList.add('active');
}

function render() {
  const container = document.getElementById('viewContainer');
  const end = Math.min((page + 1) * PER, cd.length);

  if (currentView === 'photos') {
    renderPhotosView(container, end);
  } else if (currentView === 'compact') {
    renderCompactView(container, end);
  } else if (currentView === 'list') {
    renderListView(container, end);
  } else {
    renderDetailedView(container, end);
  }

  const loadMore = document.getElementById('loadMore');
  loadMore.style.display = end < cd.length ? 'flex' : 'none';
  document.getElementById('resultCount').innerHTML = `Showing <b>${end}</b> of ${cd.length} (Total ${SD.length})`;
}

/* VIEW 1: PHOTOS GRID */
function renderPhotosView(container, end) {
  let wrap = document.getElementById('photosGrid');
  if (!wrap || page === 0) {
    container.innerHTML = '<div class="view-photos" id="photosGrid"></div>';
    wrap = document.getElementById('photosGrid');
  }
  for (let i = page * PER; i < end; i++) {
    const s = cd[i];
    const topTag = getStreamBadge(s);
    const el = document.createElement('div');
    el.className = 'photo-card';
    el.onclick = () => openProfile(i);
    el.innerHTML = `
      <div class="img-wrap">
        <span class="p-roll-tag">#${s.short_roll}</span>
        ${topTag}
        ${getImgTag(s, '','width:100%;height:100%;')}
      </div>
      <h4 title="${s.name}">${s.name}</h4>
      <div class="p-meta">${s.roll}</div>
    `;
    wrap.appendChild(el);
  }
}

/* VIEW 2: COMPACT CARDS */
function renderCompactView(container, end) {
  let wrap = document.getElementById('compactGrid');
  if (!wrap || page === 0) {
    container.innerHTML = '<div class="view-compact" id="compactGrid"></div>';
    wrap = document.getElementById('compactGrid');
  }
  for (let i = page * PER; i < end; i++) {
    const s = cd[i];
    const chip = getStreamChip(s);
    const el = document.createElement('div');
    el.className = 'compact-card';
    el.onclick = () => openProfile(i);
    el.innerHTML = `
      ${getImgTag(s, 'compact-photo')}
      <div class="compact-info">
        <h4 title="${s.name}">${s.name}</h4>
        <div class="c-sub"><b>#${s.short_roll}</b> &bull; <span style="font-family:monospace;color:var(--accent);">${s.roll}</span></div>
        <div style="margin-top:3px;">${chip}</div>
      </div>
    `;
    wrap.appendChild(el);
  }
}

/* VIEW 3: DETAILED CARDS */
function renderDetailedView(container, end) {
  let wrap = document.getElementById('detailedGrid');
  if (!wrap || page === 0) {
    container.innerHTML = '<div class="view-detailed" id="detailedGrid"></div>';
    wrap = document.getElementById('detailedGrid');
  }
  for (let i = page * PER; i < end; i++) {
    const s = cd[i];
    let badges = '';
    if (s.subjects && s.subjects.length) {
      badges = '<div class="card-badges">' + 
        s.subjects.filter(x => x.type !== 'mandatory').map(sub =>
          `<span class="sbadge ${sub.type}">${sub.name}</span>`
        ).join('') + '</div>';
    }
    const streamChip = getStreamChip(s);
    const commHtml = getCommHtml(s);
    const el = document.createElement('div');
    el.className = 'card';
    el.onclick = () => openProfile(i);
    el.innerHTML = `
      <div class="card-top">
        ${getImgTag(s, 'card-photo')}
        <div class="card-info">
          <h3>${s.name}</h3>
          <div class="meta">${s.group} &bull; Roll: <b>${s.short_roll}</b> ${streamChip}</div>
          <div class="roll">${s.roll}</div>
        </div>
      </div>
      ${badges}
      ${commHtml}
    `;
    wrap.appendChild(el);
  }
}

/* VIEW 4: DETAILS LIST */
function renderListView(container, end) {
  let tbody = document.getElementById('listTableBody');
  if (!tbody || page === 0) {
    container.innerHTML = `
      <div class="view-list">
        <table class="list-tbl">
          <thead>
            <tr>
              <th>Photo</th>
              <th>Roll</th>
              <th>Full Roll</th>
              <th>Name</th>
              <th>Group</th>
              <th>Sec/Stream</th>
              <th>4th Subject</th>
              <th>Elective</th>
              <th>Contact / Actions</th>
            </tr>
          </thead>
          <tbody id="listTableBody"></tbody>
        </table>
      </div>
    `;
    tbody = document.getElementById('listTableBody');
  }
  for (let i = page * PER; i < end; i++) {
    const s = cd[i];
    const streamChip = getStreamChip(s);
    const commHtml = getCommHtml(s);
    const tr = document.createElement('tr');
    tr.onclick = () => openProfile(i);
    tr.innerHTML = `
      <td>${getImgTag(s, 'list-photo')}</td>
      <td><b>#${s.short_roll}</b></td>
      <td><span style="font-family:monospace;color:var(--accent);">${s.roll}</span></td>
      <td><b>${s.name}</b></td>
      <td>${s.group}</td>
      <td>${streamChip || '—'}</td>
      <td><span class="sbadge fourth">${s.fourth}</span></td>
      <td><span class="sbadge elective">${s.elective}</span></td>
      <td>${commHtml || '—'}</td>
    `;
    tbody.appendChild(tr);
  }
}

function loadMoreCards() {
  page++;
  render();
}

function loadAllCards() {
  PER = cd.length;
  page = 0;
  render();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const g = document.getElementById('filterGroup').value;
  const sec = document.getElementById('filterSection').value;

  cd = SD.filter(s => {
    if (g && s.group !== g) return false;
    if (sec && s.section !== sec) return false;
    if (q) {
      const h = [s.name, s.roll, s.short_roll, s.group, s.section || '', s.father || '', s.mother || '', s.phone || '', s.reg_no || ''].join(' ').toLowerCase();
      if (!h.includes(q)) return false;
    }
    return true;
  });
  page = 0;
  render();
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterGroup').value = '';
  document.getElementById('filterSection').value = '';
  applyFilters();
}

function openProfile(idx) {
  const s = cd[idx];
  const streamChip = getStreamChip(s);
  
  let commButtons = '';
  if (s.phone && s.phone !== '—') {
    const pNum = s.phone.replace(/[^0-9]/g, '');
    if (pNum.length >= 10) {
      const intl = pNum.startsWith('88') ? pNum : ('88' + pNum.replace(/^0/, ''));
      commButtons = `
        <div style="display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:wrap;">
          <a href="tel:${pNum}" class="comm-btn call" style="padding:6px 14px;font-size:13px;" title="Direct Call"><i class="fa-solid fa-phone"></i> Call</a>
          <a href="https://wa.me/${intl}" target="_blank" class="comm-btn whatsapp" style="padding:6px 14px;font-size:13px;" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
          <a href="https://t.me/+${intl}" target="_blank" class="comm-btn telegram" style="padding:6px 14px;font-size:13px;" title="Telegram"><i class="fa-brands fa-telegram"></i> Telegram</a>
        </div>
      `;
    }
  }

  let actionChips = '';
  if (s.pdf_link && s.pdf_link !== '—') {
    actionChips += `
      <a href="${s.pdf_link}" target="_blank" class="pdf-chip-btn" style="padding:7px 16px;font-size:13px;" title="View / Download Official Admission Receipt">
        <i class="fa-solid fa-file-pdf"></i> Official Admission Slip / Receipt
      </a>
    `;
  }
  if (s.photo_url && s.photo_url !== '—') {
    actionChips += `
      <a href="${s.photo_url}" target="_blank" class="comm-btn web-photo" style="padding:7px 16px;font-size:13px;" title="Open original photo on Dhaka College website">
        <i class="fa-solid fa-cloud-arrow-down"></i> Alternative Web Photo
      </a>
    `;
  }
  
  document.getElementById('profileHdr').innerHTML = `
    ${getImgTag(s, '', 'width:150px;height:150px;border-radius:20px;object-fit:cover;border:3.5px solid var(--accent);box-shadow:var(--sh-md);margin-bottom:12px;cursor:pointer;', 'onclick="window.open(this.src, \'_blank\')" title="Click to view full photo"')}
    <div class="info">
      <h2>${s.name}</h2>
      <div class="sub">${s.group} &bull; Roll: <b>${s.short_roll}</b> ${streamChip}</div>
      ${commButtons}
      ${actionChips ? `<div style="display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap;">${actionChips}</div>` : ''}
    </div>
  `;
  
  let body = `
    <div class="pf-row"><span class="pf-lbl">College Roll</span><span class="pf-val" style="font-family:monospace;color:var(--accent);">${s.roll}</span></div>
    <div class="pf-row"><span class="pf-lbl">Group</span><span class="pf-val">${s.group}</span></div>
    <div class="pf-row"><span class="pf-lbl">Section / Stream</span><span class="pf-val">${s.section ? 'Section ' + s.section : s.group}</span></div>
    <div class="pf-row"><span class="pf-lbl">Session</span><span class="pf-val">${s.session}</span></div>
    <div class="pf-row"><span class="pf-lbl">4th Subject</span><span class="pf-val"><span class="sbadge fourth">${s.fourth}</span></span></div>
    <div class="pf-row"><span class="pf-lbl">Elective Subject</span><span class="pf-val"><span class="sbadge elective">${s.elective}</span></span></div>
    ${s.local_photo ? `<div class="pf-row"><span class="pf-lbl">Local Photo File</span><span class="pf-val"><a href="${s.local_photo}" target="_blank" style="color:var(--text);text-decoration:none;font-weight:600;"><i class="fa-regular fa-image"></i> ${s.local_photo.split('/').pop()}</a></span></div>` : ''}
    ${s.photo_url ? `<div class="pf-row"><span class="pf-lbl">Dhaka College Website Photo</span><span class="pf-val"><a href="${s.photo_url}" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:700;"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open Website Photo</a></span></div>` : ''}
    
  `;
  
  
  
  document.getElementById('profileBody').innerHTML = body;
  document.getElementById('profileModal').classList.add('show');
}

function closeProfile() {
  document.getElementById('profileModal').classList.remove('show');
}

function toggleTheme() {
  const d = document.documentElement;
  d.setAttribute('data-theme', d.getAttribute('data-theme') === 'dark' ? '' : 'dark');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeProfile();
});
</script>
