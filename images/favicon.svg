<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Database Metallic Blue Gradient -->
    <linearGradient id="dbBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Cylinder Top Surface Gradient -->
    <linearGradient id="dbTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- LED Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- STANDALONE DATABASE LOGO -->
  <g transform="translate(0, 25)">

    <!-- LAYER 3 (BOTTOM DISK) -->
    <g>
      <path d="M 40,270 C 40,350 460,350 460,270 V 340 C 460,420 40,420 40,340 Z" fill="url(#dbBody)" stroke="#0369A1" stroke-width="3" />
      <ellipse cx="250" cy="270" rx="210" ry="72" fill="url(#dbTop)" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />
      <!-- Circuit Accent Lines -->
      <path d="M 130,345 H 280 M 310,345 H 380" stroke="#00D8F6" stroke-width="5" stroke-linecap="round" />
      <circle cx="295" cy="345" r="5" fill="#FFFFFF" />
    </g>

    <!-- LAYER 2 (MIDDLE DISK) -->
    <g>
      <path d="M 40,155 C 40,235 460,235 460,155 V 225 C 460,305 40,305 40,225 Z" fill="url(#dbBody)" stroke="#0369A1" stroke-width="3" />
      <ellipse cx="250" cy="155" rx="210" ry="72" fill="url(#dbTop)" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />
      <!-- Circuit Accent Lines -->
      <path d="M 100,230 H 220 M 250,230 H 400" stroke="#00D8F6" stroke-width="5" stroke-linecap="round" />
      <circle cx="235" cy="230" r="5" fill="#FFFFFF" />
    </g>

    <!-- LAYER 1 (TOP DISK) -->
    <g>
      <path d="M 40,40 C 40,120 460,120 460,40 V 110 C 460,190 40,190 40,110 Z" fill="url(#dbBody)" stroke="#0369A1" stroke-width="3" />
      <ellipse cx="250" cy="40" rx="210" ry="72" fill="url(#dbTop)" stroke="#FFFFFF" stroke-width="4" />
      <!-- Circuit Accent Lines -->
      <path d="M 150,115 H 320" stroke="#00D8F6" stroke-width="5" stroke-linecap="round" />
      <circle cx="335" cy="115" r="5" fill="#FFFFFF" />
    </g>

    <!-- Status LED Indicators -->
    <g fill="#00F0FF" filter="url(#glow)">
      <circle cx="85" cy="80" r="7" />
      <circle cx="85" cy="190" r="7" />
      <circle cx="85" cy="305" r="7" />
    </g>

  </g>
</svg>
