<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Database Blue Gradient -->
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Cyan Glow Radial Gradient -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="70%" stop-color="#00A8E8" />
      <stop offset="100%" stop-color="#006699" />
    </radialGradient>
  </defs>

  <!-- 1. Academic Shield Outline -->
  <path d="M 120,80 Q 250,50 380,80 V 250 C 380,360 250,440 250,445 C 250,440 120,360 120,250 Z" 
        fill="#FFFFFF" stroke="#0F2342" stroke-width="12" stroke-linejoin="round"/>
  
  <!-- Inner Shield Accent Border -->
  <path d="M 135,95 Q 250,68 365,95 V 245 C 365,345 250,420 250,423 C 250,420 135,345 135,245 Z" 
        fill="none" stroke="#0F2342" stroke-width="3" opacity="0.3"/>

  <!-- 2. Monogram Letters (DC) -->
  <!-- Vector Path for D -->
  <path d="M 155,140 H 195 C 225,140 245,155 245,190 C 245,225 225,240 195,240 H 155 Z M 177,162 V 218 H 193 C 208,218 221,208 221,190 C 221,172 208,162 193,162 Z" fill="#0F2342"/>
  
  <!-- Vector Path for C -->
  <path d="M 345,162 C 335,148 320,140 300,140 C 270,140 250,162 250,190 C 250,218 270,240 300,240 C 320,240 336,230 346,215 L 328,202 C 322,212 313,218 300,218 C 285,218 274,206 274,190 C 274,174 285,162 300,162 C 312,162 321,168 327,178 Z" fill="#0F2342"/>

  <!-- 3. Outer Circuit Traces & Connections -->
  <g stroke="#00D8F6" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Circuits -->
    <path d="M 200,290 L 150,290 L 110,315 H 65" />
    <path d="M 200,320 L 165,320 L 125,345 H 80" />
    <path d="M 200,350 L 175,350 L 140,375 H 95" />
    
    <!-- Right Circuits -->
    <path d="M 300,290 L 350,290 L 390,315 H 435" />
    <path d="M 300,320 L 335,320 L 375,345 H 420" />
    <path d="M 300,350 L 325,350 L 360,375 H 405" />
  </g>

  <!-- Circuit Nodes (Cyan Circles) -->
  <g fill="#00D8F6" stroke="#0F2342" stroke-width="2">
    <circle cx="65" cy="315" r="7" />
    <circle cx="80" cy="345" r="7" />
    <circle cx="95" cy="375" r="7" />
    <circle cx="435" cy="315" r="7" />
    <circle cx="420" cy="345" r="7" />
    <circle cx="405" cy="375" r="7" />
  </g>

  <!-- Vertical Connection Line to Top Star -->
  <line x1="250" y1="260" x2="250" y2="130" stroke="#00D8F6" stroke-width="6" stroke-linecap="round"/>

  <!-- 4. Central Database Stack -->
  <g>
    <!-- Disk Layer 3 (Bottom) -->
    <path d="M 200,330 C 200,352 300,352 300,330 V 350 C 300,372 200,372 200,350 Z" fill="url(#dbGrad)" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Disk Layer 2 (Middle) -->
    <path d="M 200,305 C 200,327 300,327 300,305 V 325 C 300,347 200,347 200,325 Z" fill="url(#dbGrad)" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Disk Layer 1 (Top Body) -->
    <path d="M 200,280 C 200,302 300,302 300,280 V 300 C 300,322 200,322 200,300 Z" fill="url(#dbGrad)" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Top Ellipse Face -->
    <ellipse cx="250" cy="280" rx="50" ry="16" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- 5. Top Node with Star -->
  <circle cx="250" cy="120" r="22" fill="url(#cyanGlow)" stroke="#0F2342" stroke-width="3"/>
  <polygon points="250,108 254,116 263,117 257,123 259,131 250,127 241,131 243,123 237,117 246,116" fill="#FFFFFF"/>
</svg>
