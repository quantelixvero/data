<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F243E" />
      <stop offset="70%" stop-color="#081426" />
      <stop offset="100%" stop-color="#030811" />
    </radialGradient>

    <!-- Database Metallic Cyan Gradient -->
    <linearGradient id="dbBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Database Top Ellipse Gradient -->
    <linearGradient id="dbTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Graduation Cap / Accent Cyan Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00D8F6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Circular Outer Frame (No Text) -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="#00D8F6" stroke-width="4" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="#1E3E62" stroke-width="2" />
  <!-- Tech Dashed Orbit Ring -->
  <circle cx="250" cy="250" r="205" fill="none" stroke="#00D8F6" stroke-width="2" stroke-dasharray="8 12" opacity="0.4" />

  <!-- 2. Academic Foundation: Open Book Base -->
  <g fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.8">
    <!-- Left Page -->
    <path d="M 250,405 C 200,385 140,390 100,410 V 375 C 140,355 200,350 250,370 Z" fill="#081426" />
    <!-- Right Page -->
    <path d="M 250,405 C 300,385 360,390 400,410 V 375 C 360,355 300,350 250,370 Z" fill="#081426" />
    <!-- Book Lines -->
    <path d="M 130,385 C 170,372 210,370 240,380" stroke="#00D8F6" stroke-width="1.5" />
    <path d="M 370,385 C 330,372 290,370 260,380" stroke="#00D8F6" stroke-width="1.5" />
  </g>

  <!-- 3. Tech Circuit Connections -->
  <g stroke="#00D8F6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <!-- Left Connections (To Student Profile Node) -->
    <path d="M 125,240 H 160 L 180,265 H 190" />
    <path d="M 125,270 H 150 L 170,295 H 190" />
    <!-- Right Connections (To Student ID / Cert Node) -->
    <path d="M 375,240 H 340 L 320,265 H 310" />
    <path d="M 375,270 H 350 L 330,295 H 310" />
  </g>

  <!-- 4. Main Database Stack (Center Emblem) -->
  <g transform="translate(0, 10)">
    <!-- Disk Layer 3 (Bottom) -->
    <g>
      <path d="M 170,290 C 170,318 330,318 330,290 V 330 C 330,358 170,358 170,330 Z" fill="url(#dbBody)" stroke="#030811" stroke-width="2.5" />
      <ellipse cx="250" cy="290" rx="80" ry="26" fill="url(#dbTop)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
      <path d="M 210,330 H 260" stroke="#00D8F6" stroke-width="3" stroke-linecap="round" />
      <circle cx="267" cy="330" r="3" fill="#FFFFFF" />
    </g>

    <!-- Disk Layer 2 (Middle) -->
    <g>
      <path d="M 170,245 C 170,273 330,273 330,245 V 282 C 330,310 170,310 170,282 Z" fill="url(#dbBody)" stroke="#030811" stroke-width="2.5" />
      <ellipse cx="250" cy="245" rx="80" ry="26" fill="url(#dbTop)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" />
      <path d="M 200,282 H 280" stroke="#00D8F6" stroke-width="3" stroke-linecap="round" />
      <circle cx="287" cy="282" r="3" fill="#FFFFFF" />
    </g>

    <!-- Disk Layer 1 (Top) -->
    <g>
      <path d="M 170,200 C 170,228 330,228 330,200 V 235 C 330,263 170,263 170,235 Z" fill="url(#dbBody)" stroke="#030811" stroke-width="2.5" />
      <ellipse cx="250" cy="200" rx="80" ry="26" fill="url(#dbTop)" stroke="#FFFFFF" stroke-width="2" />
      <path d="M 220,235 H 270" stroke="#00D8F6" stroke-width="3" stroke-linecap="round" />
      <circle cx="277" cy="235" r="3" fill="#FFFFFF" />
    </g>

    <!-- LED Status Lights -->
    <g fill="#00D8F6">
      <circle cx="190" cy="222" r="3" />
      <circle cx="190" cy="267" r="3" />
      <circle cx="190" cy="312" r="3" />
    </g>
  </g>

  <!-- 5. Student Element Left: Student Profile Avatar Node -->
  <g transform="translate(115, 255)">
    <circle cx="0" cy="0" r="28" fill="#081426" stroke="#00D8F6" stroke-width="3" />
    <!-- User Silhouette -->
    <circle cx="0" cy="-6" r="9" fill="#38BDF8" />
    <path d="M -16,16 C -16,4 16,4 16,16 Z" fill="#38BDF8" />
  </g>

  <!-- 6. Student Element Right: Student ID / Document Node -->
  <g transform="translate(385, 255)">
    <circle cx="0" cy="0" r="28" fill="#081426" stroke="#00D8F6" stroke-width="3" />
    <!-- ID Card Symbol -->
    <rect x="-13" y="-14" width="26" height="28" rx="3" fill="none" stroke="#38BDF8" stroke-width="2" />
    <line x1="-8" y1="-7" x2="8" y2="-7" stroke="#38BDF8" stroke-width="2" />
    <line x1="-8" y1="-1" x2="4" y2="-1" stroke="#38BDF8" stroke-width="2" />
    <circle cx="-3" cy="6" r="3" fill="#38BDF8" />
  </g>

  <!-- 7. Crown Element: Graduation Cap (Mortarboard) Top -->
  <g transform="translate(250, 115)" filter="url(#glow)">
    <!-- Cap Base Strand -->
    <path d="M -40,18 C -40,32 40,32 40,18 V 28 C 40,40 -40,40 -40,28 Z" fill="#0284C7" stroke="#00D8F6" stroke-width="1.5" />
    
    <!-- Top Diamond Board -->
    <polygon points="0,-35 85,-5 0,25 -85,-5" fill="url(#cyanAccent)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="0,-27 68,-5 0,17 -68,-5" fill="#081426" opacity="0.5" />
    
    <!-- Button & Tassel -->
    <circle cx="0" cy="-5" r="4" fill="#FFFFFF" />
    <path d="M 0,-5 L 60,12 L 60,42" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="56,42 64,42 60,55" fill="#FFFFFF" />
  </g>

  <!-- Academic Stars Accent -->
  <g fill="#00D8F6">
    <polygon points="150,130 153,137 161,137 155,142 157,149 150,144 143,149 145,142 139,137 147,137" opacity="0.8" />
    <polygon points="350,130 353,137 361,137 355,142 357,149 350,144 343,149 345,142 339,137 347,137" opacity="0.8" />
  </g>
</svg>
